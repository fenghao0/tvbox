name: 同步上游并重建配置

on:
  schedule:
    # 以上游脚本 .github/workflows/collect.yml 的 cron 为基准顺延 2 小时：
    #   上游：'30 19 * * *'  = UTC 19:30 = 北京 03:30
    #   本仓库：'30 21 * * *' = UTC 21:30 = 北京 05:30
    - cron: '30 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sync.py', 'build_config.py', '.github/workflows/sync.yml']

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 拉取上游并镜像
        run: python sync.py
      - name: 转换并验活
        run: python build_config.py
      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "无变化"; exit 0; fi
          git commit -m "chore: 同步上游并重建配置"
          git pull --rebase -X theirs || true
          git push
